function vSim(){
  setTimeout(runSim,50);
  return `<div class="screen"><div class="simwrap"><div class="ball"></div><div class="simgame" id="sg">SIMULATING SEASON</div><div class="simrec" id="sr"><span class="w">0</span>-<span class="l">0</span></div><div class="simbar"><i id="sb"></i></div>${M.mode==='pvp'?`<div class="simgame" style="color:var(--coral)">${M.live&&!M.oppDone?esc(M.opp.name)+' is still drafting ('+M.oppShown+'/5)':esc(M.opp.name)+' is simulating too…'}</div>`:''}</div></div>`;
}
function runSim(){
  const sc=score(M.lineup);M.score=sc;
  const R=rng(M.seed^0xabc);const games=Array(82).fill(0).map((_,i)=>i<sc.wins?1:0);
  for(let i=81;i>0;i--){const j=Math.floor(R()*(i+1));[games[i],games[j]]=[games[j],games[i]]}
  let g=0,w=0,l=0;const sr=document.getElementById('sr'),sg=document.getElementById('sg'),sb=document.getElementById('sb');
  const step=()=>{ if(S.screen!=='sim')return; const k=Math.min(82,g+2); for(;g<k;g++){games[g]?w++:l++} if(sr)sr.innerHTML=`<span class="w">${w}</span>-<span class="l">${l}</span>`; if(sg)sg.textContent=`GAME ${g} / 82`; if(sb)sb.style.width=(g/82*100)+'%'; if(g%6===0)sfx.tick(); if(g<82)setTimeout(step,32); else setTimeout(finish,600) };
  step();
}

function finish(){
  if(!M||M.finished)return;
  if(M.mode==='pvp'&&M.live){
    if(!(M.oppDone||M.oppForfeit)){M.waiting=true;go('wait');return}
    if(M.oppDone){const lu={};M.oppPicks.forEach(x=>lu[x.slot]=x.player);M.oppDraft=Object.assign({lineup:lu},score(lu))}
    else M.oppDraft={lineup:{},wins:0,losses:82,power:0,forfeit:true};
    endLive();
  }
  M.finished=true;
  const sc=M.score;let payout=0,res=null;
  if(M.mode==='bts'){M.mult=payoutMult(sc.wins);payout=Math.round(M.room.fee*M.mult);}
  else if(M.mode==='pvp'){
    const o=M.oppDraft;
    res = sc.wins>o.wins?'w':sc.wins<o.wins?'l':(sc.power>o.power?'w':sc.power<o.power?'l':'t');
    payout = res==='w'?Math.round(M.room.fee*(2-2*RAKE)):res==='t'?M.room.fee:0;
    if(res==='w')P.pvpW++; if(res==='l')P.pvpL++;
  } else if(M.mode==='daily'){payout=Math.round(sc.wins*3);const dl=dailyState();dl.done=true;dl.w=sc.wins}
  else payout=10+Math.round(sc.wins/4);
  M.payout=payout;M.res=res;
  const done=[bump('play3'),M.mode==='bts'&&bump('bts2'),res==='w'&&bump('pvpwin'),sc.wins>=55&&bump('w55'),sc.wins>=65&&bump('w65'),M.mode==='daily'&&bump('daily'),
    (M.teamR===1&&M.eraR===1&&!M.boostUsed)&&bump('norespin'),POS.some(s=>M.lineup[s]&&M.lineup[s].o>=93)&&bump('star'),
    Object.values(POS.reduce((c,s)=>{const x=M.lineup[s];if(x)c[x.e]=(c[x.e]||0)+1;return c},{})).some(v=>v>=3)&&bump('era'),
    (M.mode==='bts'&&payout>M.room.fee)&&bump('cash')].filter(Boolean);
  M.missionDone=done;
  P.coins+=payout;P.xp+=20+Math.round(sc.wins/3)+(res==='w'?25:0);
  P.best[M.mode]=Math.max(P.best[M.mode]||0,sc.wins);
  P.history.unshift({mode:M.mode,entry:M.mode==='free'?0:M.room.fee,payout,wins:sc.wins,oppW:M.oppDraft?M.oppDraft.wins:null,opp:M.opp?M.opp.name:null,res,live:!!M.live,five:POS.map(s=>M.lineup[s]?last(M.lineup[s].n):'-'),t:Date.now()});
  P.history=P.history.slice(0,100);save();pushScore();
  const shownBefore=SHOWN;
  go('result');
  SHOWN=shownBefore;const ce=document.querySelector('#coins span:last-child');if(ce)ce.textContent=cash(SHOWN);
  setTimeout(()=>{if(payout){flyCoins(document.querySelector('.payout'),Math.min(14,4+Math.round(payout/80)));setTimeout(syncCoins,700)}else syncCoins()},900);
  M.missionDone.forEach((m,i)=>setTimeout(()=>{toast('Mission complete: '+m.t+' · claim it in Missions');sfx.coin()},1800+i*2600));
  if(level()>M.lvBefore)setTimeout(()=>levelUp(level()),2200+M.missionDone.length*600);
  const good = M.mode==='pvp'?res==='w':M.mode==='bts'?M.mult>=1:sc.wins>=50;
  setTimeout(()=>{ if(good){sfx.win();confetti(sc.wins>=72||M.mult>=5?260:140);if(payout)setTimeout(sfx.coin,400)}else sfx.lose(); },250);
  if(M.mode==='pvp')setTimeout(revealBattles,300);
}

/* ---------- RESULT ---------- */
function luRows(lineup){return `<div class="lu hd"><span>POS</span><span>PLAYER</span><span style="text-align:right">PPG</span><span style="text-align:right">RPG</span><span style="text-align:right">APG</span><span style="text-align:right">OVR</span></div>`+POS.map(s=>{const p=lineup[s];if(!p)return '';return `<div class="lu"><span class="pos">${s}</span><span class="nm">${esc(p.n)}<small>${esc(DATA.teams[p.t].city)} · ${p.e}</small></span><span class="st">${p.p.toFixed(1)}</span><span class="st">${p.r.toFixed(1)}</span><span class="st">${p.a.toFixed(1)}</span><span class="ov" style="color:${p.o>=90?'var(--gold)':p.o>=82?'var(--ink)':'var(--ink3)'}">${p.o}</span></div>`}).join('')}
function chemHtml(sc){return sc.chem.length?`<div class="chems">${sc.chem.map(c=>`<span class="${c.v>0?'g':'b'}">${c.v>0?'+':''}${c.v} ${esc(c.k)}</span>`).join('')}</div>`:''}

function vResult(){
  const sc=M.score;
  const again=M.mode==='daily'?`<div class="btnrow"><button class="btn ghost" data-act="share">Share</button><button class="btn lime" data-act="ranksdaily" style="flex:1.4">Daily ranks</button></div><button class="btn ghost" data-act="home" style="margin-top:10px">Home</button>`:`<div class="btnrow"><button class="btn ghost" data-act="home">Home</button><button class="btn ghost" data-act="share" style="flex:.7">Share</button></div><button class="btn ${M.mode==='pvp'?'coral':'lime'}" data-act="again" style="margin-top:12px">${M.mode==='free'?'Draft again':`Play again · ${cash(M.room.fee)}`}</button>`;
  setTimeout(resultFX,30);
  if(M.mode==='pvp'){
    const o=M.oppDraft;const lbl=o.forfeit?'Win by forfeit':M.res==='w'?'You win':M.res==='l'?'You lose':'Push';
    return `<div class="screen"><div class="top"><button class="iconbtn" data-act="home">${ICON.back}</button><div class="sp"></div>${coinChip()}</div>
    <div class="scroll">
      <div class="vs"><div class="side me"><div class="av2">${initials(P.name)||'Y'}</div><div class="nm">${esc(P.name)}</div><div class="rec" style="color:${M.res==='w'?'var(--win)':'var(--ink)'}">${sc.wins}-${sc.losses}</div></div><div class="x">VS</div>
      <div class="side op"><div class="av2">${initials(M.opp.name.replace(/[_\d]/g,' '))||'?'}</div><div class="nm">${esc(M.opp.name)}</div><div class="rec" style="color:${M.res==='l'?'var(--win)':'var(--ink)'}">${o.wins}-${o.losses}</div></div></div>
      <div class="banner ${M.res}" style="${o.forfeit?'font-size:44px':''}">${lbl}</div><div class="help">${M.live?'<span class="livedot"></span>Live duel vs a real player':'Practice duel vs a bot'}</div>
      <div class="payout ${M.payout?'hit':'zero'}"><span class="coin"></span>${M.payout?'+'+cash(M.payout):'$0'}</div>
      <div class="battles">${POS.map(s=>{const a=M.lineup[s],b=o.lineup[s];const aw=a&&(!b||a.o>b.o),bw=b&&(!a||b.o>a.o);return `<div class="bt"><div class="a ${aw?'won':''}"><b>${a?esc(a.n):'-'}</b><small>${a?`${a.pos[0]==s?'':''}${esc(a.t)} ${a.e} · <span class="ovr" style="color:${aw?'var(--win)':'var(--ink3)'}">${a.o}</span>`:''}</small></div><div class="p">${s}</div><div class="b ${bw?'won':''}"><b>${b?esc(b.n):'-'}</b><small>${b?`<span class="ovr" style="color:${bw?'var(--win)':'var(--ink3)'}">${b.o}</span> · ${esc(b.t)} ${b.e}`:''}</small></div></div>`}).join('')}</div>
      <div class="help" style="margin-top:10px">Same spins, same pools. Records decide the duel; team power breaks ties (you ${sc.power.toFixed(1)} · them ${o.power.toFixed(1)}).</div>
      ${chemHtml(sc)}
    </div>${again}</div>`;
  }
  const fee=M.room?M.room.fee:0;
  const kHit=LADDER.filter(st=>sc.wins>=st.w).length;
  const nextSt=LADDER.find(st=>sc.wins<st.w);
  const lad = M.mode==='bts'?`<div class="ladder" data-k="${kHit}">
    <div class="lhd"><span>WINS</span><span>MULTI</span><span style="text-align:right">YOU GET</span></div>
    <div class="ltrack"><i class="lfill"></i></div><div class="lpuck"><small>YOU</small>${sc.wins}</div>
    ${LADDER.slice().reverse().map(st=>`<div class="lrow"><span class="w">${st.w===82?'82-0':st.w+'+'}</span><span class="m">${st.m}×</span><span class="get"><small>PAYS</small>${cash(fee*st.m)}</span></div>`).join('')}
    <div class="lrow start"><span class="w">0+</span><span class="m">—</span><span class="get"><small>PAYS</small>$0</span></div>
    ${nextSt?`<div class="lnext">${nextSt.w-sc.wins} more win${nextSt.w-sc.wins===1?'':'s'} would have paid <b>${cash(fee*nextSt.m)}</b></div>`:''}
  </div>`:'';
  const pexp = M.mode==='bts'?(M.payout?`<div class="pexp">Entry ${cash(fee)} × ${M.mult} = <b>${cash(M.payout)}</b> · ${M.payout>=fee?'profit <b class="pos">+'+cash(M.payout-fee)+'</b>':'net <b class="neg">-'+cash(fee-M.payout)+'</b>'}</div>`:`<div class="pexp">Entry ${cash(fee)} · ${LADDER[0].w} wins needed for the first payout (${cash(fee*LADDER[0].m)})</div>`):'';
  return `<div class="screen"><div class="top"><button class="iconbtn" data-act="home">${ICON.back}</button><div class="sp"></div>${coinChip()}</div>
  <div class="scroll">
    <div class="recbox"><div class="lbl">${M.mode==='bts'?'BEAT THE SCORE · '+M.room.nm.toUpperCase():M.mode==='daily'?'DAILY CHALLENGE · '+todayKey():'FREE PLAY'} · FINAL RECORD</div><div class="big"><span data-count="${sc.wins}">0</span><i>-</i><span data-count="${sc.losses}">0</span></div>
      <div class="pw">Team power ${sc.power.toFixed(1)} · ${sc.pts.toFixed(0)} PPG · ${sc.reb.toFixed(0)} RPG · ${sc.ast.toFixed(0)} APG</div>${chemHtml(sc)}
      <div class="payout ${M.payout?'hit':'zero'}">${M.payout?'<small class="plbl">YOU WON</small>'+cash(M.payout):'No payout'}${M.mode==='bts'&&M.mult?`<span class="pmult">${M.mult}×</span>`:''}</div>${pexp}
    </div>
    ${lad}
    <div class="lineup">${luRows(M.lineup)}</div>
  </div>${again}</div>`;
}
function revealBattles(){document.querySelectorAll('.bt').forEach((el,i)=>setTimeout(()=>{el.classList.add('in');sfx.sel()},i*260))}

function resultFX(){
  document.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,t0=performance.now(),d=900;(function st(n){const k=Math.min(1,(n-t0)/d),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e);if(k<1)requestAnimationFrame(st)})(t0)});
  climbLadder();
  document.querySelectorAll('.lu').forEach((r,i)=>{r.style.animationDelay=(400+i*70)+'ms';r.classList.add('rise')});
}
function climbLadder(){
  const lad=document.querySelector('.ladder[data-k]');if(!lad)return;
  const rows=[...lad.querySelectorAll('.lrow')],n=rows.length,k=+lad.dataset.k;
  const c=r=>r.offsetTop+r.offsetHeight/2,top=c(rows[0]),st=c(rows[n-1]),tg=c(rows[n-1-k]);
  const tr=lad.querySelector('.ltrack'),fill=lad.querySelector('.lfill'),pk=lad.querySelector('.lpuck');
  tr.style.top=top+'px';tr.style.height=(st-top)+'px';pk.style.top=st+'px';
  rows[n-1].classList.add('lit');
  const D=k?500+k*260:0,T0=700;
  setTimeout(()=>{
    pk.style.transition=fill.style.transition=`all ${D}ms linear`;
    pk.style.top=tg+'px';fill.style.height=(st-tg)+'px';
    for(let i=1;i<=k;i++)setTimeout(()=>{const r=rows[n-1-i];r.classList.add(i===k?'hit':'lit');sfx.sel();if(i===k){pk.classList.add('land');const b=r.getBoundingClientRect();burst(b.right-50,b.top+b.height/2,40)}},D*i/k);
    if(!k)setTimeout(()=>{pk.classList.add('miss');rows[n-1].classList.add('hit0')},100);
    setTimeout(()=>lad.querySelector('.lnext')?.classList.add('in'),D+300);
  },T0);
}
function levelUp(lv){
  const unlock=lv===2?'Pro rooms unlocked':lv===4?'Legend rooms unlocked':'Bigger rewards ahead';
  const sc=document.createElement('div');sc.className='scrim center';
  sc.innerHTML=`<div class="lvup"><div class="rays"></div><small>LEVEL UP</small><div class="lvn">${lv}</div><b>${unlock}</b><button class="btn lime" style="margin-top:16px">Let's go</button></div>`;
  sc.addEventListener('click',e=>{if(e.target===sc||e.target.closest('button'))sc.remove()});
  $app.appendChild(sc);sfx.win();confetti(220);
}
setInterval(()=>{const t=hms(msToMidnight());document.querySelectorAll('.cd').forEach(e=>e.textContent=t)},1000);
/* ---------- confetti ---------- */
function burst(x,y,n){confetti(n,x,y,.5)}
function confetti(n,ox,oy,pw){
  const c=document.getElementById('fx'),x=c.getContext('2d');c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;
  const cols=['#c8ff3d','#ff4d6d','#ffcc4d','#4dc3ff','#ffffff'];
  const sx=ox!=null?ox*devicePixelRatio:c.width/2,sy=oy!=null?oy*devicePixelRatio:c.height*.35,pf=pw||1;const ps=Array.from({length:n},()=>({x:sx+(ox!=null?0:(Math.random()-.5)*c.width*.3),y:sy,vx:(Math.random()-.5)*22*pf*devicePixelRatio,vy:(-Math.random()*20*pf-6*pf)*devicePixelRatio,s:(4+Math.random()*6)*devicePixelRatio,r:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.6*devicePixelRatio;p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<150)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})();
}

/* ---------- events ---------- */
function bind(){
  $app.onclick=e=>{
    const t=e.target.closest('[data-act],[data-pid],[data-slot],[data-draft],[data-flt],[data-sort]');if(!t)return;
    const a=t.dataset.act;
    if(a==='snd'){P.sound=!P.sound;save();render();return}
    if(a==='tab'){if(S.tab!==t.dataset.t){S.tab=t.dataset.t;sfx.sel();haptic(8)}S.screen='home';render();return}
    if(a==='rseg'){S.rankSeg=t.dataset.s;render.last=null;render();return}
    if(a==='sseg'){S.storeSeg=t.dataset.s;render.last=null;render();return}
    if(a==='streak'){const sk=streakState();if(!sk.can)return;P.streak={n:sk.day,last:todayKey()};save();award(STREAK[sk.day-1],t);confetti(90);setTimeout(render,800);return}
    if(a==='daily'){const dl=dailyState();if(dl.done){S.tab='ranks';S.rankSeg='daily';S.screen='home';render();return} if(dl.started){toast('Today’s attempt is used. New spins at midnight UTC.');return} startMatch('daily',{fee:0,nm:'Daily'});return}
    if(a==='ranksdaily'){M=null;S.tab='ranks';S.rankSeg='daily';go('home');return}
    if(a==='mclaim'){const ms=missions();const m=MISSIONS.find(x=>x.id===t.dataset.id);if(!m||ms.claimed[m.id]||(ms.prog[m.id]||0)<m.goal)return;ms.claimed[m.id]=1;award(m.rw,t);setTimeout(render,800);return}
    if(a==='pack'){const pk=PACKS[+t.dataset.i];if(pk.ad){if(Date.now()-(P.lastAd||0)<60000){toast('Next video in '+Math.ceil((60000-(Date.now()-(P.lastAd||0)))/1000)+'s');return}P.lastAd=Date.now()}award(pk.c,t);return}
    if(a==='buy'){const b=BOOSTS.find(x=>x.id===t.dataset.id);if(!b||P.coins<b.price)return;P.coins-=b.price;if(b.id==='bundle'){P.boost.team+=3;P.boost.era+=3;P.boost.scout+=3}else P.boost[b.id]++;save();sfx.pick();burst(e.clientX,e.clientY,18);render();return}
    if(a==='challenge'){openChallenge(t.dataset.p);return}
    if(a==='accept'){acceptChallenge(t.dataset.p);return}
    if(a==='decline'){const p=NET.peers.find(x=>x.peer===t.dataset.p);if(p&&p.presence.ch)NET.room.presence({dec:{to:p.peer,at:p.presence.ch.at}}).catch(()=>{});if(p&&p.presence.ch){NET.declined=NET.declined||new Set();NET.declined.add(p.peer+':'+p.presence.ch.at)}render();return}
    if(a==='unchallenge'){NET.myCh=null;clearTimeout(NET.chTimer);if(NET.room)NET.room.presence({ch:null}).catch(()=>{});render();return}
    if(a==='sharelink'){const d={title:'Buzzer Draft Duel',text:'Draft five legends and duel me in Buzzer Draft Duel',url:ARTIFACT_URL};if(navigator.share)navigator.share(d).catch(()=>{});else{try{navigator.clipboard.writeText(ARTIFACT_URL);toast('Link copied')}catch(e){toast(ARTIFACT_URL)}}return}
    if(a==='copylink'){try{navigator.clipboard.writeText(ARTIFACT_URL).then(()=>toast('Link copied'),()=>toast(ARTIFACT_URL))}catch(e){toast(ARTIFACT_URL)}return}
    if(a==='mode'){sfx.sel();openRooms(t.dataset.m);return}
    if(a==='free'){startMatch('free',{fee:0,nm:'Free',skill:0});return}
    if(a==='nick'){openNick();return}
    if(a==='bot'){startBot();return}
    if(a==='cancel'){ if(M.live)return; clearTimeout(M.botTimer);clearTimeout(M.autoBot);M.searching=false;if(NET.room)NET.room.presence({q:null,want:null,m:null}).catch(()=>{});P.coins+=M.room.fee;save();M=null;go('home');return}
    if(a==='quit'){ if(M.mode!=='free'&&!(M.quitArm&&Date.now()-M.quitArm<3000)){M.quitArm=Date.now();toast('Tap ✕ again to forfeit (entry is lost)');return} { if(M.mode==='pvp'){P.pvpL++;P.history.unshift({mode:'pvp',entry:M.room.fee,payout:0,wins:0,oppW:M.oppDraft?M.oppDraft.wins:0,opp:M.opp.name,res:'l',five:['forfeit'],t:Date.now()});save(); if(M.live&&M.game){M.game.presence({forfeit:true}).catch(()=>{});M.finished=true;endLive()}} M=null;go('home');} return}
    if(a==='spin'){doSpin('spin');return}
    if(a==='rt'){if(M.teamR)M.teamR--;else if(boostAvail('team')){P.boost.team--;M.boostUsed=true;save()}else return;doSpin('team');return}
    if(a==='re'){if(M.eraR)M.eraR--;else if(boostAvail('era')){P.boost.era--;M.boostUsed=true;save()}else return;doSpin('era');return}
    if(a==='scout'){if(!M.scout&&boostAvail('scout')){P.boost.scout--;M.scout=true;M.boostUsed=true;save();sfx.win();render()}return}
    if(a==='home'){if(M&&M.live&&!M.finished)return;M=null;go('home');return}
    if(a==='again'){const{mode,room}=M; if(mode!=='free'&&P.coins<room.fee){toast('Not enough cash');return} startMatch(mode,room);return}
    if(a==='share'){const sc=M.score;const txt=`I went ${sc.wins}-${sc.losses} in Buzzer Draft Duel with ${POS.map(s=>last(M.lineup[s].n)).join(', ')}. Beat that.`;if(navigator.share)navigator.share({text:txt}).catch(()=>{});else{try{navigator.clipboard.writeText(txt);toast('Copied to clipboard')}catch(e){}}return}
    if(t.dataset.flt){M.filter=t.dataset.flt;render();return}
    if(t.dataset.sort){M.sort=t.dataset.sort;render();return}
    if(t.dataset.pid){M.sel=M.sel===t.dataset.pid?null:t.dataset.pid;sfx.sel();const st=document.querySelector('.rows')?.scrollTop;render();const r=document.querySelector('.rows');if(r&&st!=null)r.scrollTop=st;return}
    if(t.dataset.draft){draft(t.dataset.draft);return}
    if(t.dataset.slot&&M&&M.sel){const p=M.pool.players.find(x=>x.id===M.sel);if(p&&openSlotsFor(p,M.lineup).includes(t.dataset.slot))draft(t.dataset.slot);return}
  };
}
render();
})();
