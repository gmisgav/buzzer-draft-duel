<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#141a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Buzzer Draft Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090c; --bg2:#0d1117; --card:#121821; --card2:#18202b; --line:#222c39; --line2:#2c3949;
  --ink:#f3f6f9; --ink2:#a9b4c2; --ink3:#6c7887;
  --lime:#c8ff3d; --lime2:#9fd61a; --limeInk:#0b1200;
  --coral:#ff4d6d; --coral2:#d93355;
  --gold:#ffcc4d; --sky:#4dc3ff;
  --win:#3dff9a; --lose:#ff5a5a;
  --r:16px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --disp:'Big Shoulders Display',Impact,sans-serif; --body:'Inter Tight',system-ui,sans-serif;
}
:root[data-theme="light"]{ /* game is dark-only by design; tokens kept for contract */ }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overscroll-behavior:none}
body{background:radial-gradient(120% 60% at 50% -10%,#1a2410 0%,transparent 55%),var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{max-width:480px;margin:0 auto;height:100dvh;position:relative;overflow:hidden;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;padding:calc(var(--sat) + 10px) 16px calc(var(--sab) + 12px)}
.screen.enter{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.disp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.02em}

/* top bar */
.top{display:flex;align-items:center;gap:10px;height:44px;flex-shrink:0}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 45%,#c8901a);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);display:inline-block;flex-shrink:0}
.coin.sm{width:16px;height:16px}
.lvl{display:flex;align-items:center;gap:8px}
.lvl .av{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--lime),#56d12b);color:var(--limeInk);display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:18px}
.lvl small{display:block;color:var(--ink3);font-size:11px;font-weight:600}
.lvl b{font-size:13px}
.xpbar{width:70px;height:4px;border-radius:4px;background:var(--line);margin-top:3px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--lime)}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

/* home */
.hero{margin:18px 0 6px}
.hero h1{font-family:var(--disp);font-weight:900;font-size:64px;line-height:.85;margin:0;letter-spacing:.01em}
.hero h1 span{color:var(--lime)}
.hero p{margin:8px 0 0;color:var(--ink2);font-size:14px;line-height:1.4}
.modes{display:flex;flex-direction:column;gap:12px;margin-top:18px;overflow-y:auto;padding-bottom:8px;min-height:0;flex:1}
.mode{flex-shrink:0;position:relative;text-align:left;border-radius:20px;padding:18px;overflow:hidden;border:1px solid var(--line);background:var(--card);transition:transform .12s}
.mode:active{transform:scale(.98)}
.mode .tag{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.mode h2{font-family:var(--disp);font-weight:900;font-size:34px;line-height:.95;margin:6px 0 6px;text-transform:uppercase}
.mode p{margin:0;color:var(--ink2);font-size:13px;line-height:1.4;max-width:78%}
.mode .art{position:absolute;right:-6px;bottom:-10px;font-family:var(--disp);font-weight:900;font-size:92px;line-height:1;opacity:.14}
.mode.bts{background:linear-gradient(135deg,#1d2a07 0%,#121821 70%);border-color:#3a520f}
.mode.bts .tag,.mode.bts .art{color:var(--lime)}
.mode.pvp{background:linear-gradient(135deg,#34101a 0%,#121821 70%);border-color:#5a1c2b}
.mode.pvp .tag,.mode.pvp .art{color:var(--coral)}
.mode.free .tag{color:var(--sky)}
.mode .meta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--ink2)}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--win);margin-right:5px;box-shadow:0 0 0 0 rgba(61,255,154,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(61,255,154,0)}100%{box-shadow:0 0 0 0 rgba(61,255,154,0)}}
.bonus{display:flex;align-items:center;gap:12px;background:var(--card);border:1px dashed var(--line2);border-radius:16px;padding:12px 14px}
.bonus b{font-size:14px}.bonus small{display:block;color:var(--ink3);font-size:12px}
.bonus .sp{flex:1}

.nav{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding-top:8px;margin:6px -16px 0;flex-shrink:0}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--ink3);padding:4px 18px}
.nav button.on{color:var(--lime)}
.nav svg{width:22px;height:22px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:16px;font-family:var(--disp);font-weight:900;font-size:24px;letter-spacing:.04em;text-transform:uppercase;width:100%;transition:transform .1s,filter .1s}
.btn:active{transform:scale(.97)}
.btn.lime{background:var(--lime);color:var(--limeInk);box-shadow:0 6px 0 var(--lime2),0 12px 30px rgba(200,255,61,.25)}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 6px 0 var(--coral2),0 12px 30px rgba(255,77,109,.25)}
.btn.ghost{background:var(--card);border:1px solid var(--line2);font-size:20px;height:50px}
.btn[disabled]{filter:grayscale(1) brightness(.6);pointer-events:none}

/* sheet / modal */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;animation:fadein .2s}
.sheet{width:100%;background:var(--bg2);border-top:1px solid var(--line2);border-radius:24px 24px 0 0;padding:18px 16px calc(var(--sab) + 18px);animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{font-family:var(--disp);font-weight:900;font-size:30px;margin:0 0 4px;text-transform:uppercase}
.sheet .sub{color:var(--ink2);font-size:13px;margin-bottom:14px}
.room{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.room:active{background:var(--card2)}
.room .nm{font-family:var(--disp);font-weight:900;font-size:22px;text-transform:uppercase}
.room small{display:block;color:var(--ink3);font-size:12px;margin-top:2px}
.room .sp{flex:1}
.room .fee{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums}
.room .prize{font-size:12px;color:var(--lime);font-weight:700;text-align:right;margin-top:3px}
.room.locked{opacity:.45}

/* draft */
.dhead{text-align:center;margin-top:2px}
.dhead .rd{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:.14em;color:var(--ink2)}
.pips{display:flex;gap:4px;justify-content:center;margin-top:6px}
.pips i{width:22px;height:4px;border-radius:3px;background:var(--line2)}
.pips i.on{background:var(--lime)}
.strip{display:flex;align-items:center;gap:8px;margin:10px 0 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;font-size:12px;font-weight:700;min-height:44px}
.strip .sp{flex:1}
.strip .tgt{font-family:var(--disp);font-size:20px;font-weight:900;color:var(--lime)}
.opp{display:flex;align-items:center;gap:8px}
.opp .oa{width:28px;height:28px;border-radius:9px;background:var(--coral);display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:14px;color:#fff}
.opp .dots{display:flex;gap:3px}
.opp .dots i{width:9px;height:9px;border-radius:3px;background:var(--line2)}
.opp .dots i.on{background:var(--coral)}

.reels{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;flex-shrink:0}
.reelbox{border-radius:16px;padding:3px;position:relative}
.reelbox.team{background:linear-gradient(180deg,var(--lime),#5ea90e)}
.reelbox.era{background:linear-gradient(180deg,var(--coral),#9d1f3a)}
.reelbox .lab{position:absolute;top:-1px;left:50%;transform:translate(-50%,-50%);font-size:10px;font-weight:800;letter-spacing:.14em;padding:2px 8px;border-radius:6px;z-index:2}
.reelbox.team .lab{background:var(--lime);color:var(--limeInk)}
.reelbox.era .lab{background:var(--coral);color:#fff}
.reel{height:64px;border-radius:13px;background:#05070a;overflow:hidden;position:relative;box-shadow:inset 0 8px 14px rgba(0,0,0,.8),inset 0 -8px 14px rgba(0,0,0,.8)}
.reel .rs{position:absolute;left:0;right:0;top:0;will-change:transform}
.reel .ri{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.reel .ri b{font-family:var(--disp);font-weight:900;font-size:34px}
.reel .ri small{font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.reel .ri.q b{color:var(--ink3)}
.respin{display:flex;align-items:center;justify-content:center;gap:6px;height:34px;margin-top:8px;border-radius:10px;font-size:12px;font-weight:800;letter-spacing:.06em}
.respin.t{background:rgba(200,255,61,.12);color:var(--lime)}
.respin.e{background:rgba(255,77,109,.14);color:var(--coral)}
.respin[disabled]{opacity:.3;pointer-events:none}
.respin svg{width:14px;height:14px}

.court{position:relative;flex:1;min-height:150px;margin-top:10px;transition:flex .35s}
.court{display:flex;justify-content:center;align-items:center;container-type:size}
.cin{position:relative;width:min(100cqw,138.4cqh);aspect-ratio:360/260}
.court svg.bg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .2s}
.slot .jr{width:52px;height:56px;position:relative}
.slot .jr svg{width:100%;height:100%;display:block}
.slot .jr b{position:absolute;inset:14px 0 0;text-align:center;font-family:var(--disp);font-weight:900;font-size:17px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.slot .pl{font-size:10px;font-weight:800;color:var(--ink2);letter-spacing:.08em;background:rgba(0,0,0,.5);padding:1px 6px;border-radius:5px;white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.slot.hot .jr{animation:bob .8s ease-in-out infinite}
.slot.hot .pl{background:var(--lime);color:var(--limeInk)}
@keyframes bob{50%{transform:translateY(-5px) scale(1.06)}}
.slot.new .jr{animation:land .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes land{from{transform:scale(.2) rotate(-20deg);opacity:0}}
.court.compact{flex:0 0 150px}
.court.compact .slot .jr{width:40px;height:44px}
.court.compact .slot .jr b{font-size:13px;inset:11px 0 0}
.court.compact .slot .pl{font-size:9px}

.spinwrap{flex-shrink:0;padding-top:8px}
.list{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--line);border-radius:18px 18px 0 0;margin:8px -16px calc(-12px - var(--sab));padding:12px 12px 0}
.list.enter{animation:up .3s cubic-bezier(.2,.9,.3,1)}
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lhead b{font-family:var(--disp);font-weight:900;font-size:20px;text-transform:uppercase}
.lhead .sp{flex:1}
.flt{display:flex;gap:4px}
.flt button{font-size:11px;font-weight:800;padding:5px 9px;border-radius:8px;background:var(--card);color:var(--ink3)}
.flt button.on{background:var(--ink);color:var(--bg)}
.cols{display:grid;grid-template-columns:1fr 38px 38px 38px;gap:4px;font-size:10px;font-weight:800;color:var(--ink3);letter-spacing:.08em;padding:0 10px 4px}
.cols span{text-align:right}
.cols span.s{cursor:pointer}
.cols span.s.on{color:var(--lime)}
.rows{overflow-y:auto;flex:1;min-height:0;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.row{display:grid;grid-template-columns:1fr 38px 38px 38px;gap:4px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:12px;border:1px solid transparent;margin-bottom:4px;background:var(--card)}
.row .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ps{font-size:11px;color:var(--ink3);font-weight:600;margin-top:1px}
.row .st{text-align:right;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.row.off{opacity:.3;pointer-events:none}
.row.sel{border-color:var(--lime);background:#1a2410}
.row.sel .nm{color:var(--lime)}
.actbar{display:flex;gap:8px;padding:10px 0 calc(var(--sab) + 12px);border-top:1px solid var(--line);flex-shrink:0}
.actbar .btn{height:52px;font-size:21px}

/* sim */
.simwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.ball{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb26b,#f06b1a 55%,#a3410a);position:relative;animation:bounce .5s cubic-bezier(.5,0,.5,1) infinite alternate;box-shadow:inset -6px -8px 0 rgba(0,0,0,.18)}
.ball:before,.ball:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(0,0,0,.35)}
.ball:before{clip-path:inset(0 48% 0 48%)}
.ball:after{clip-path:inset(48% 0 48% 0)}
@keyframes bounce{to{transform:translateY(-46px)}}
.simrec{font-family:var(--disp);font-weight:900;font-size:76px;line-height:1;font-variant-numeric:tabular-nums}
.simrec .w{color:var(--win)}.simrec .l{color:var(--ink3)}
.simgame{color:var(--ink2);font-size:13px;font-weight:700;letter-spacing:.12em}
.simbar{width:220px;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.simbar i{display:block;height:100%;background:var(--lime);width:0}

/* results */
.scroll{flex:1;min-height:0;overflow-y:auto;margin:0 -16px;padding:0 16px 10px}
.recbox{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 14px 14px;margin-top:8px;position:relative;overflow:hidden}
.recbox .lbl{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--ink3)}
.recbox .big{font-family:var(--disp);font-weight:900;font-size:88px;line-height:.9;font-variant-numeric:tabular-nums;margin-top:4px}
.recbox .big i{font-style:normal;color:var(--ink3);font-size:.6em;vertical-align:.25em;margin:0 6px}
.recbox .pw{color:var(--ink2);font-size:13px;font-weight:600;margin-top:6px}
.chems{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.chems span{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px}
.chems .g{background:rgba(61,255,154,.12);color:var(--win)}
.chems .b{background:rgba(255,90,90,.12);color:var(--lose)}
.payout{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;font-family:var(--disp);font-weight:900;font-size:40px}
.payout.zero{color:var(--ink3)}
.payout.hit{color:var(--gold)}
.ladder{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;font-weight:700;font-size:14px;position:relative}
.lrow .w{font-family:var(--disp);font-weight:900;font-size:20px;width:64px}
.lrow .m{margin-left:auto;font-family:var(--disp);font-weight:900;font-size:22px}
.lrow .bar{flex:1;height:4px;border-radius:4px;background:var(--line)}
.lrow.done .bar{background:var(--lime2)}
.lrow.hit{background:var(--lime);color:var(--limeInk)}
.lrow.hit .bar{background:rgba(0,0,0,.25)}
.lrow.hit .w,.lrow.hit .m{color:var(--limeInk)}
.lrow .you{position:absolute;left:-4px;top:50%;transform:translate(-100%,-50%)}
.lineup{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.lu{display:grid;grid-template-columns:40px 1fr 36px 36px 36px 40px;gap:4px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
.lu:last-child{border-bottom:0}
.lu .pos{font-family:var(--disp);font-weight:900;font-size:20px;color:var(--lime)}
.lu .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu .nm small{display:block;color:var(--ink3);font-weight:600;font-size:11px}
.lu .st{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink2)}
.lu .ov{text-align:right;font-family:var(--disp);font-weight:900;font-size:18px}
.lu.hd{font-size:10px;font-weight:800;color:var(--ink3);letter-spacing:.08em;padding:8px 12px}
.btnrow{display:flex;gap:10px;margin-top:10px;flex-shrink:0}

.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:6px}
.vs .side{text-align:center}
.vs .av2{width:54px;height:54px;border-radius:16px;margin:0 auto 6px;display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:24px}
.vs .me .av2{background:var(--lime);color:var(--limeInk)}
.vs .op .av2{background:var(--coral);color:#fff}
.vs .nm{font-weight:800;font-size:13px}
.vs .rec{font-family:var(--disp);font-weight:900;font-size:40px;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}
.vs .x{font-family:var(--disp);font-weight:900;font-size:28px;color:var(--ink3)}
.banner{margin-top:12px;text-align:center;font-family:var(--disp);font-weight:900;font-size:58px;line-height:1;letter-spacing:.02em}
.banner.w{color:var(--win);text-shadow:0 0 40px rgba(61,255,154,.4)}
.banner.l{color:var(--lose)}
.banner.t{color:var(--gold)}
.battles{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.bt{display:grid;grid-template-columns:1fr 38px 1fr;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;opacity:0;transform:translateY(6px);transition:all .3s}
.bt.in{opacity:1;transform:none}
.bt:last-child{border-bottom:0}
.bt .a{text-align:left}.bt .b{text-align:right}
.bt .a b,.bt .b b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt small{color:var(--ink3);font-size:11px;font-weight:600}
.bt .p{text-align:center;font-family:var(--disp);font-weight:900;font-size:18px;color:var(--ink3)}
.bt .won b{color:var(--win)}
.bt .ovr{font-family:var(--disp);font-weight:900;font-size:16px}

/* matchmaking */
.mm{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.radar{width:180px;height:180px;border-radius:50%;border:1px solid var(--line2);position:relative;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,77,109,.12),transparent 70%)}
.radar:before,.radar:after{content:"";position:absolute;border-radius:50%;border:1px solid var(--line2)}
.radar:before{inset:30px}.radar:after{inset:60px}
.radar .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,77,109,.5),transparent 25%);animation:spin 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:absolute;left:50%;top:calc(var(--sat) + 60px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:13px;z-index:60;white-space:nowrap;animation:toast 2.4s forwards;max-width:92%;overflow:hidden;text-overflow:ellipsis}

.flycoin{position:absolute;z-index:70;pointer-events:none}
canvas#fx{position:absolute;inset:0;pointer-events:none;z-index:80}

/* ===== v3: premium shell, footer, tabs, motion ===== */
body:before{content:"";position:fixed;inset:-25%;pointer-events:none;z-index:0;background:radial-gradient(38% 28% at 18% 18%,rgba(200,255,61,.10),transparent 62%),radial-gradient(34% 30% at 82% 72%,rgba(255,77,109,.10),transparent 62%),radial-gradient(30% 24% at 60% 30%,rgba(77,195,255,.06),transparent 60%);animation:drift 22s ease-in-out infinite alternate}

#app{z-index:1}
.screen.tabs{padding-bottom:0}
.pane{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;margin:0 -16px;padding:2px 16px 18px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pane::-webkit-scrollbar{display:none}
.pane.enter-r{animation:inR .34s cubic-bezier(.2,.9,.3,1)}
.pane.enter-l{animation:inL .34s cubic-bezier(.2,.9,.3,1)}
@keyframes inR{from{opacity:0;transform:translateX(28px)}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}}
.rise{animation:rise .55s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}}
.stg{display:flex;flex-direction:column;gap:12px}
.stg>.hero{margin:6px 0 0}
.hero h1{font-size:58px}
.hero h1 span{background:linear-gradient(90deg,var(--lime),#7dff9e,var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:sheen 4s linear infinite}
@keyframes sheen{to{background-position:200% 0}}
.mode{transition:transform .15s,box-shadow .3s}
.mode:hover{box-shadow:0 10px 40px rgba(0,0,0,.4)}
.mode .art{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-3deg)}}
.mode:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 60%);transform:translateX(-100%);animation:glint 5s ease-in-out infinite}
.mode.pvp:before{animation-delay:1.6s}.mode.free:before{animation-delay:3.2s}
@keyframes glint{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.btn{position:relative;overflow:hidden}
.btn.lime:after,.btn.coral:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
.btnrow .btn{flex:1;width:auto;min-width:0}
.btn.sm{height:40px;width:auto;padding:0 16px;font-size:18px;box-shadow:0 4px 0 var(--lime2)}
.chip{transition:transform .2s}
.chip.bump{animation:bump .6s cubic-bezier(.2,1.8,.4,1)}
.chip.drop{animation:drop .4s}
@keyframes bump{30%{transform:scale(1.18);box-shadow:0 0 0 6px rgba(255,204,77,.25)}}
@keyframes drop{30%{transform:translateX(-4px)}60%{transform:translateX(4px)}}
.flycoin{z-index:90;pointer-events:none;width:20px;height:20px}

/* footer */
.nav5{position:relative;display:grid;grid-template-columns:repeat(5,1fr);margin:0 -16px;padding:7px 8px calc(var(--sab) + 8px);background:linear-gradient(180deg,rgba(10,13,18,.85),#07090c);border-top:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);flex-shrink:0}
.nav5 .ind{position:absolute;top:7px;height:52px;left:8px;width:calc((100% - 16px)/5);border-radius:16px;background:linear-gradient(180deg,var(--lime),#a6e21f);box-shadow:0 8px 24px rgba(200,255,61,.35),inset 0 -3px 0 rgba(0,0,0,.15);transform:translateX(calc(var(--i)*100%));transition:transform .5s cubic-bezier(.3,1.35,.5,1)}
.nav5 button{position:relative;z-index:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--ink3);text-transform:uppercase;transition:color .3s}

.nav5 button.on{color:var(--limeInk)}

.nav5 button:active svg{transform:scale(.85)}

/* shared bits */
h2.sec{font-size:38px;margin:6px 0 0}
.subh{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-top:6px}

/* daily banner */
.daily{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border-radius:18px;padding:14px 16px;background:linear-gradient(120deg,#3a2a05,#1b1606 55%,#121821);border:1px solid #6b5212;position:relative;overflow:hidden}
.daily:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,204,77,.35),transparent 70%);animation:breathe 3s ease-in-out infinite}

/* friends */
.chal{display:flex;align-items:center;gap:10px;border-radius:16px;padding:12px;border:1px solid var(--line2);background:var(--card)}
.chal.in{border-color:var(--coral);background:linear-gradient(120deg,#3a0f1b,#121821);animation:ring 1.4s ease-in-out infinite}

.chal b{font-size:14px;display:block}.chal small{color:var(--ink2);font-size:12px}
.chal .sp{flex:1;min-width:0}
.radar.sm{width:36px;height:36px;flex-shrink:0}.radar.sm:before,.radar.sm:after{display:none}
.invite{display:flex;flex-direction:column;gap:10px;border-radius:18px;padding:14px;background:linear-gradient(135deg,#16240a,#121821 70%);border:1px solid #31480f}
.invite b{font-family:var(--disp);font-weight:900;font-size:22px;text-transform:uppercase;display:block}
.invite small{color:var(--ink2);font-size:12px;line-height:1.45;display:block;margin-top:2px}
.row2{display:flex;gap:8px}
.fr{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.fr .sp{flex:1;min-width:0}.fr b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fr small{color:var(--ink3);font-size:12px;display:flex;align-items:center;gap:5px}
.av3{width:38px;height:38px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:16px;background:var(--card2);border:1px solid var(--line2);position:relative}
.av3.on:after,.av3.srch:after{content:"";position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--win);box-shadow:0 0 0 2px var(--card)}
.av3.srch:after{background:var(--gold)}
.av3.sm{width:30px;height:30px;font-size:13px;border-radius:10px}
.st{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--win)}.st.busy{background:var(--coral)}.st.srch{background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ranks */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin-top:4px}
.pd{text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.pd b{font-size:13px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd small{font-family:var(--disp);font-weight:900;font-size:16px;color:var(--ink2)}
.av4{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:22px;background:var(--card2);border:3px solid var(--line2)}
.pd.p1 .av4{width:66px;height:66px;font-size:26px;border-color:var(--gold);box-shadow:0 0 30px rgba(255,204,77,.35)}
.pd.p2 .av4{border-color:#c9d3de}.pd.p3 .av4{border-color:#d9874a}

.pd.p3 .blk{height:54px;background:linear-gradient(180deg,#f0a56d,#a85b25);animation-delay:.4s}
@keyframes grow{from{transform:scaleY(0)}}
.pd.me b{color:var(--lime)}
.lb{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lbr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}

.lbr .rk{width:22px;color:var(--ink3);font-weight:800;font-variant-numeric:tabular-nums}
.lbr b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbr .lv{font-size:11px;color:var(--ink3);font-weight:700}

.lbr.me{background:#1a2410}
.mybar{text-align:center;background:var(--lime);color:var(--limeInk);border-radius:14px;padding:10px;font-weight:700;font-size:14px}

.sd.got{opacity:.45}.sd.got b:after{content:" ✓";color:var(--win)}

@keyframes ring2{50%{box-shadow:0 0 0 4px rgba(200,255,61,.2)}}

/* ===== v4: casual 3D skin ===== */
:root{
  --bg:#121845; --bg2:#182057; --card:#212a6b; --card2:#2b3683; --line:#323d8c; --line2:#4150a6;
  --ink:#ffffff; --ink2:#c3cbf5; --ink3:#8a94d1;
  --lime:#b6f23a; --lime2:#6f9e0c; --limeInk:#1d3200;
  --coral:#ff4f7b; --coral2:#b81f4c;
  --gold:#ffc93c; --sky:#3fc5ff;
  --disp:'Lilita One','Arial Rounded MT Bold',Impact,sans-serif; --body:'Nunito',system-ui,sans-serif;
  --edge:#0a0e33;
  --raise:inset 0 1.5px 0 rgba(255,255,255,.14),inset 0 -3px 0 rgba(0,0,0,.22),0 5px 0 var(--edge),0 10px 22px rgba(5,8,40,.45);
  --raise-sm:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -2px 0 rgba(0,0,0,.2),0 3px 0 var(--edge);
  --well:inset 0 3px 6px rgba(0,0,0,.35),inset 0 -1px 0 rgba(255,255,255,.06);
}
html{font-synthesis:none}
body{background:radial-gradient(110% 55% at 50% -8%,#3a3fb0 0%,transparent 60%),linear-gradient(180deg,#1a2160,#0e1338)}
body:before{background:radial-gradient(36% 26% at 16% 16%,rgba(182,242,58,.13),transparent 62%),radial-gradient(34% 30% at 84% 70%,rgba(255,79,123,.14),transparent 62%),radial-gradient(30% 24% at 60% 34%,rgba(63,197,255,.12),transparent 60%)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;background-image:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.3px);background-size:22px 22px;mask-image:linear-gradient(180deg,#000,transparent 70%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%)}
.disp,.hero h1,.mode h2,.sheet h3,.room .nm,.btn,h2.sec,.mm h3,.banner,.simrec,.recbox .big,.payout,.daily b,.invite b,.lvup .lvn,.stat b,.reel .ri b,.lrow .w,.lrow .m,.vs .rec,.lhead b,.pack b,.daily .go,.strip .tgt,.lu .pos,.lu .ov,.bt .p,.bt .ovr,.lbr .vl,.pd small,.pd .blk,.sd b{font-weight:400;letter-spacing:.01em}

/* type scale for the rounder, wider face */
.hero h1{font-size:50px;line-height:.92;text-shadow:0 4px 0 var(--edge)}
.hero h1 span{filter:drop-shadow(0 4px 0 #36540a);text-shadow:none}
.mode h2{font-size:30px;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.mode .art{font-size:84px}
h2.sec{font-size:36px;text-shadow:0 3px 0 var(--edge)}
.sheet h3{font-size:28px;text-shadow:0 3px 0 var(--edge)}
.mm h3{font-size:30px;text-shadow:0 3px 0 var(--edge)}
.room .nm{font-size:22px}
.reel .ri b{font-size:28px;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.simrec{font-size:64px;text-shadow:0 5px 0 var(--edge)}
.recbox .big{font-size:76px;filter:drop-shadow(0 5px 0 var(--edge))}
.banner{font-size:50px;-webkit-text-stroke:2px rgba(0,0,0,.25);paint-order:stroke fill}
.banner.w{text-shadow:0 5px 0 #0d6b3e,0 0 40px rgba(61,255,154,.4)}
.banner.l{text-shadow:0 5px 0 #7a1630}
.banner.t{text-shadow:0 5px 0 #8a6210}
.vs .rec{font-size:36px}
.payout{font-size:36px;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.lvup .lvn{font-size:100px}
.stat b{font-size:26px}
.lrow .w{font-size:19px}.lrow .m{font-size:21px}
.daily b{font-size:22px}.daily.big b{font-size:24px}
.lhead b{font-size:19px}

/* cash badge (replaces coin) */
.coin{background:radial-gradient(circle at 35% 28%,#b9ffd8,#29d17a 50%,#0e8a49);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 2px 0 rgba(0,0,0,.25);display:inline-grid;place-items:center;position:relative}
.coin:after{content:"$";font-family:var(--disp);font-size:14px;line-height:1;color:#05391c;text-shadow:0 1px 0 rgba(255,255,255,.45)}
.coin.sm:after{font-size:11px}
.flycoin:after{font-size:13px}
.chip{background:linear-gradient(180deg,#2c3786,#1c246a);border:1.5px solid #4655b5;box-shadow:var(--raise-sm);font-size:15px;font-weight:900;color:#eafff1}

/* top bar */
.iconbtn{background:linear-gradient(180deg,var(--card2),var(--card));border:1.5px solid var(--line2);border-radius:14px;box-shadow:var(--raise-sm);transition:transform .08s,box-shadow .08s}
.iconbtn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 var(--edge)}
.lvl .av{border-radius:14px;background:linear-gradient(180deg,#d6ff7a,var(--lime) 50%,#8fcc1a);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 3px 0 var(--lime2);font-weight:400;font-size:19px;border:2px solid #fff3}
.xpbar{height:6px;background:#0d1240;box-shadow:var(--well)}
.xpbar i{background:linear-gradient(180deg,#e2ff8f,var(--lime));border-radius:4px}

/* ===== buttons: chunky, glossy, press-down ===== */
.btn{height:58px;border-radius:20px;font-size:24px;letter-spacing:.03em;transition:transform .08s ease,box-shadow .08s ease,filter .15s;isolation:isolate}
.btn:active{transform:translateY(5px)}
.btn:before{content:"";position:absolute;left:8px;right:8px;top:4px;height:44%;border-radius:14px 14px 22px 22px/14px 14px 10px 10px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.05));pointer-events:none;z-index:-1}
.btn.lime{background:linear-gradient(180deg,#d8ff7c 0%,var(--lime) 48%,#93d11a 100%);color:var(--limeInk);border:2px solid #4c7406;text-shadow:0 1.5px 0 rgba(255,255,255,.45);box-shadow:inset 0 -4px 0 rgba(60,100,0,.35),0 6px 0 #3f6204,0 12px 24px rgba(120,200,0,.35)}
.btn.lime:active{box-shadow:inset 0 -2px 0 rgba(60,100,0,.35),0 1px 0 #3f6204,0 4px 10px rgba(120,200,0,.3)}
.btn.coral{background:linear-gradient(180deg,#ff8aa6 0%,var(--coral) 50%,#e8305f 100%);color:#fff;border:2px solid #8c1438;text-shadow:0 2px 0 rgba(120,10,40,.55);box-shadow:inset 0 -4px 0 rgba(120,0,40,.3),0 6px 0 #7d1233,0 12px 24px rgba(255,79,123,.35)}
.btn.coral:active{box-shadow:inset 0 -2px 0 rgba(120,0,40,.3),0 1px 0 #7d1233,0 4px 10px rgba(255,79,123,.3)}
.btn.ghost{background:linear-gradient(180deg,#3a46a0,#28327f);border:2px solid #10165a;color:#fff;font-size:21px;height:52px;text-shadow:0 2px 0 rgba(0,0,0,.35);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 5px 0 #0b1048,0 10px 20px rgba(5,8,40,.4)}
.btn.ghost:before{opacity:.35}
.btn.ghost:active{box-shadow:inset 0 -2px 0 rgba(0,0,0,.2),0 1px 0 #0b1048}
.btn.sm{height:42px;font-size:18px;border-radius:14px;box-shadow:inset 0 -3px 0 rgba(60,100,0,.35),0 4px 0 #3f6204}
.btn.sm:active{transform:translateY(3px);box-shadow:0 1px 0 #3f6204}
.btn[disabled]{filter:grayscale(.9) brightness(.7)}
.actbar .btn{height:54px;font-size:21px}

.mini{height:38px;border-radius:12px;font-weight:900;background:linear-gradient(180deg,#3a46a0,#28327f);border:1.5px solid #10165a;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 3px 0 #0b1048;transition:transform .08s,box-shadow .08s}
.mini:active{transform:translateY(3px);box-shadow:0 0 0 #0b1048}
.mini.lime{background:linear-gradient(180deg,#d8ff7c,var(--lime) 55%,#93d11a);border:1.5px solid #4c7406;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 3px 0 #3f6204}
.mini.lime:active{box-shadow:0 0 0 #3f6204}
.respin{height:36px;border-radius:12px;font-weight:900;transition:transform .08s,box-shadow .08s}
.respin.t{background:linear-gradient(180deg,#4b6a14,#334c08);color:#e4ff9e;border:1.5px solid #1f3300;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 3px 0 #172600}
.respin.e{background:linear-gradient(180deg,#8a2446,#621430);color:#ffd0dd;border:1.5px solid #3d0819;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 3px 0 #2d0612}
.respin:active{transform:translateY(3px);box-shadow:none}
.pbtn{border-radius:10px;font-weight:900;padding:7px 0;background:linear-gradient(180deg,#7dffbb,#2fd37f);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 0 #0e7a42}
.pbtn.ad{background:linear-gradient(180deg,#ffe28a,var(--gold));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 0 #a5760c}
.daily .go{font-weight:400;border-radius:14px;background:linear-gradient(180deg,#ffe58f,var(--gold) 55%,#f2a90f);border:2px solid #8a5d00;box-shadow:inset 0 -3px 0 rgba(120,70,0,.3),0 4px 0 #7a5200;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.scoutb{background:linear-gradient(180deg,#5c4710,#3f300a);border:1px solid #241b03;box-shadow:0 2px 0 #1c1502;border-radius:9px}
.flt button{border-radius:9px;font-weight:900;background:linear-gradient(180deg,var(--card2),var(--card));box-shadow:0 2px 0 var(--edge)}
.flt button.on{background:linear-gradient(180deg,#fff,#dfe5ff);color:#1b2160;box-shadow:0 2px 0 #8d97d6}

/* ===== surfaces: raised cards ===== */
.room,.strip,.recbox,.ladder,.lineup,.battles,.hi,.stat,.chal,.fr,.lb,.mi,.bst,.sd{background:linear-gradient(180deg,var(--card2),var(--card));border:1.5px solid rgba(255,255,255,.08);box-shadow:var(--raise)}
.bonus{background:linear-gradient(180deg,#2c3a8a,#222c70);border:2px dashed #5664c6;box-shadow:var(--raise)}
.room{border-radius:20px;transition:transform .08s,box-shadow .08s}
.room:active{transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 0 var(--edge)}
.room .prize{color:#7dffbb}
.mode{border-radius:24px;border:2px solid rgba(255,255,255,.1);transition:transform .08s,box-shadow .12s}
.mode.bts{background:linear-gradient(150deg,#5d8a12 0%,#2f4a0b 45%,#1f2a68 100%);border-color:#86c21e;box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 6px 0 #26400a,0 14px 30px rgba(10,15,50,.5)}
.mode.pvp{background:linear-gradient(150deg,#c22a58 0%,#6e1534 45%,#1f2a68 100%);border-color:#ff6f95;box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 6px 0 #5c0f29,0 14px 30px rgba(10,15,50,.5)}
.mode.free{background:linear-gradient(150deg,#1b7bb8 0%,#173f86 45%,#1f2a68 100%);border-color:#4fc9ff;box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 6px 0 #0d2a63,0 14px 30px rgba(10,15,50,.5)}
.mode:active{transform:translateY(5px);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 1px 0 var(--edge)}
.mode .tag{display:inline-block;background:rgba(0,0,0,.28);padding:4px 9px;border-radius:8px;color:#fff!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.mode p{color:rgba(255,255,255,.82)}
.mode .art{opacity:.22;color:#fff!important;text-shadow:0 6px 0 rgba(0,0,0,.3)}
.pill{background:rgba(0,0,0,.25);color:#e8ecff;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.daily{border-radius:22px;background:linear-gradient(140deg,#e09a12 0%,#8a4f06 45%,#262e70 100%);border:2px solid #ffd25e;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 6px 0 #5c3a03,0 14px 30px rgba(10,15,50,.45)}
.daily .tag{color:#fff2c4}.daily small{color:#ffeccc}.daily .cd{color:#fff}
.invite{border-radius:22px;background:linear-gradient(140deg,#4f8a13,#25450a 50%,#212a6b);border:2px solid #8fd12a;box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 6px 0 #1d3407}
.chal.in{background:linear-gradient(140deg,#b0244f,#5a1030 55%,#212a6b);border:2px solid #ff6f95}
.seg{background:#10164a;border:1.5px solid #2a3480;box-shadow:var(--well);border-radius:16px}
.seg button{border-radius:12px;font-weight:900}
.seg button.on{background:linear-gradient(180deg,#fff,#dde3ff);color:#1b2160;box-shadow:inset 0 -2px 0 rgba(0,0,40,.12),0 3px 0 #8d97d6}
.pack{border-radius:20px;background:linear-gradient(180deg,#34419a,#222c70);border:1.5px solid rgba(255,255,255,.1);box-shadow:var(--raise);transition:transform .08s,box-shadow .08s}
.pack:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.pack b{text-shadow:0 2px 0 rgba(0,0,0,.35)}
.ptag{border-radius:8px;box-shadow:0 2px 0 #7d1233;font-weight:900}
.bic{box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 0 rgba(0,0,0,.25)}
.bic.team{background:linear-gradient(180deg,#5d8a12,#3a5a08);color:#eaffb0}.bic.era{background:linear-gradient(180deg,#c22a58,#7d1535);color:#fff}.bic.scout{background:linear-gradient(180deg,#e0a314,#9a6a05);color:#fff}.bic.bundle{background:linear-gradient(180deg,#1f8fd0,#135c9a);color:#fff}
.hi .md{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 rgba(0,0,0,.25)}
.av3{background:linear-gradient(180deg,#3d4aa8,#2a3482);border:1.5px solid #5664c6;box-shadow:0 2px 0 var(--edge)}
.av4{background:linear-gradient(180deg,#3d4aa8,#2a3482);box-shadow:0 4px 0 var(--edge)}
.pd .blk{box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.15)}
.lbr{border-bottom-color:rgba(255,255,255,.06)}
.lbr.me,.row.sel,.sd.now{background:linear-gradient(180deg,#46661a,#2f4810)}
.mybar{background:linear-gradient(180deg,#d8ff7c,var(--lime));border:2px solid #4c7406;box-shadow:0 4px 0 #3f6204;font-weight:800}
.pbar{height:10px;border-radius:8px;background:#10164a;box-shadow:var(--well)}
.pbar i{border-radius:8px;background:linear-gradient(180deg,#e6ff9c,var(--lime) 55%,#86c21e);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.mi.dn{border-color:var(--lime);box-shadow:var(--raise),0 0 24px rgba(182,242,58,.2)}

/* draft */
.reelbox{border-radius:18px;padding:4px;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 5px 0 rgba(0,0,0,.35)}
.reelbox.team{background:linear-gradient(180deg,#d8ff7c,#7fb714);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 0 #3f6204}
.reelbox.era{background:linear-gradient(180deg,#ff8aa6,#c4204f);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 0 #7d1233}
.reelbox .lab{border-radius:8px;font-weight:900;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.reel{border-radius:14px;background:linear-gradient(180deg,#0b0f36,#161d55 50%,#0b0f36)}
.row{border-radius:14px;background:linear-gradient(180deg,#28327c,#212a6b);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 0 var(--edge);margin-bottom:6px}
.row:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.row.sel{border-color:var(--lime);box-shadow:0 3px 0 #3f6204,0 0 0 2px rgba(182,242,58,.25)}
.list{background:linear-gradient(180deg,#1b2260,#141a4a);border:1.5px solid #3a46a0;border-bottom:0;border-radius:24px 24px 0 0;box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 -10px 30px rgba(5,8,40,.4)}
.actbar{border-top-color:rgba(255,255,255,.08)}
.slot .pl{background:rgba(20,26,74,.85);color:#fff;border-radius:7px;padding:2px 7px;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.slot.hot .pl{box-shadow:0 2px 0 #3f6204}
.slot .jr svg{filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.pips i{height:6px;border-radius:4px;background:#10164a;box-shadow:var(--well)}
.pips i.on{background:linear-gradient(180deg,#e6ff9c,var(--lime))}
.opp .oa,.vs .av2,.vsbig .c .av2,.radar .me{box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 rgba(0,0,0,.35);font-weight:400}
.lrow{border-radius:14px}
.lrow .bar{height:6px;background:#10164a;box-shadow:var(--well)}
.lrow.hit{background:linear-gradient(180deg,#d8ff7c,var(--lime));box-shadow:0 3px 0 #3f6204}
.lu{border-bottom-color:rgba(255,255,255,.07)}
.bt{border-bottom-color:rgba(255,255,255,.07)}
.simbar{height:10px;border-radius:8px;background:#10164a;box-shadow:var(--well)}
.simbar i{background:linear-gradient(180deg,#e6ff9c,var(--lime))}
.radar{border:2px solid #3a46a0;background:radial-gradient(circle,rgba(255,79,123,.2),rgba(16,22,74,.6) 70%);box-shadow:0 6px 0 var(--edge),inset 0 0 30px rgba(0,0,0,.35)}

/* footer */
.nav5{background:linear-gradient(180deg,#232c78,#161c55);border-top:2px solid #4150a6;border-radius:24px 24px 0 0;box-shadow:inset 0 2px 0 rgba(255,255,255,.1),0 -8px 24px rgba(5,8,40,.45)}
.nav5 .ind{border-radius:18px;background:linear-gradient(180deg,#d8ff7c,var(--lime) 55%,#93d11a);border:2px solid #4c7406;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 4px 0 #3f6204,0 10px 22px rgba(182,242,58,.3)}
.nav5 button{font-weight:900;color:#9aa4e0}
.nav5 .bdg{box-shadow:0 0 0 2px #161c55,0 2px 0 #7d1233}

/* sheets, toasts, modals */
.scrim{background:rgba(8,10,40,.65);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{background:linear-gradient(180deg,#232c78,#161c55);border-top:2px solid #5664c6;border-radius:28px 28px 0 0;box-shadow:inset 0 2px 0 rgba(255,255,255,.12)}
.sheet:before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:rgba(255,255,255,.25);margin:-6px auto 12px}
.toast{border-radius:16px;font-weight:800;background:linear-gradient(180deg,#fff,#e2e7ff);color:#1b2160;box-shadow:0 4px 0 #8d97d6,0 10px 24px rgba(5,8,40,.4)}
.toast.opp{background:linear-gradient(180deg,#ff8aa6,var(--coral));box-shadow:0 4px 0 #7d1233}
.lvup{border-radius:30px;background:radial-gradient(circle at 50% 30%,#4a7a14,#1c2466 70%);border:2px solid #8fd12a;box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 8px 0 #1d3407}

/* v4 ladder climb */
.ladder{position:relative;padding:10px 10px 12px 58px;border-radius:22px}
.lhd{display:grid;grid-template-columns:62px 1fr 1fr;gap:8px;padding:0 12px 6px;font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--ink3)}
.lrow,.lrow.in{display:grid;grid-template-columns:62px 1fr 1fr;align-items:center;gap:8px;height:46px;padding:0 12px;margin:3px 0;border-radius:14px;opacity:.5;transform:none;transition:opacity .25s,background .25s,transform .3s cubic-bezier(.2,1.7,.4,1),box-shadow .25s;animation:none}
.lrow .w{width:auto;font-size:20px}
.lrow .m{margin:0;justify-self:start;font-size:15px;font-family:var(--disp);background:rgba(0,0,0,.25);padding:3px 9px;border-radius:9px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.lrow .get{text-align:right;font-family:var(--disp);font-size:24px;color:#7dffbb;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.lrow .get small{display:block;font-family:var(--body);font-size:9px;font-weight:900;letter-spacing:.14em;color:var(--ink3);text-shadow:none;margin-bottom:2px}
.lrow.start .get{color:var(--ink3)}
.lrow.lit{opacity:1;background:rgba(182,242,58,.12)}
.lrow.lit .w:after{content:" ✓";font-size:14px;color:var(--lime)}
.lrow.start.lit{background:rgba(255,255,255,.04)}.lrow.start.lit .w:after{content:""}
.lrow.hit{opacity:1;background:linear-gradient(180deg,#d8ff7c,var(--lime) 55%,#93d11a);color:var(--limeInk);transform:scale(1.04);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 #3f6204,0 0 30px rgba(182,242,58,.45);animation:hitpulse 1.6s .4s infinite}
.lrow.hit .w,.lrow.hit .get{color:var(--limeInk);text-shadow:0 1px 0 rgba(255,255,255,.4)}
.lrow.hit .get{font-size:28px}
.lrow.hit .get small{color:#2c4a00}.lrow.hit .get small{font-size:0}.lrow.hit .get small:before{content:"YOU WIN";font-size:9px}
.lrow.hit .m{background:rgba(0,0,0,.15)}
.lrow.hit .w:after{content:""}
.lrow.hit0{opacity:1;background:rgba(255,90,90,.12)}
.ltrack{position:absolute;left:24px;width:12px;border-radius:8px;background:#10164a;box-shadow:var(--well)}
.lfill{position:absolute;left:0;right:0;bottom:0;height:0;border-radius:8px;background:linear-gradient(0deg,#86c21e,#e6ff9c);box-shadow:0 0 14px rgba(182,242,58,.6)}
.lpuck{position:absolute;left:8px;width:44px;height:44px;margin-top:-22px;border-radius:14px;background:linear-gradient(180deg,#fff,#dfe5ff);color:#1b2160;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);font-size:19px;line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,40,.12),0 4px 0 #6f7bc4,0 8px 18px rgba(5,8,40,.5);z-index:2}
.lpuck small{font-family:var(--body);font-size:8px;font-weight:900;letter-spacing:.12em;color:#5a64a8}
.lpuck.land{animation:pucky .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes pucky{40%{transform:scale(1.3) rotate(-6deg)}}
.lpuck.miss{animation:drop .4s 2}

<script>
(function(){
const {POS, db, makeSeq, openSlotsFor, eligible, takenNames, score, botDraft, LADDER, payoutMult, rng} = BZ;
const $app = document.getElementById('app');
const DATA = db();

/* ---------- storage ---------- */
const KEY='buzzer.v1';
const store={get(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}},set(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}};
const P = Object.assign({coins:1500,xp:0,name:'You',history:[],lastBonus:0,best:{bts:0,pvp:0,free:0},pvpW:0,pvpL:0,sound:true}, store.get()||{});
if(!P.name||P.name==='You'){P.name='Hooper'+(100+Math.floor(Math.random()*900));store.set(P)}

const level=()=>Math.floor(P.xp/150)+1;
const xpPct=()=>Math.round((P.xp%150)/150*100);

/* ---------- audio (synthesized) ---------- */
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,d=.08,type='square',v=.06,slide=0,delay=0){ if(!P.sound)return; const a=ac(); if(!a)return; const t=a.currentTime+delay; const o=a.createOscillator(),g=a.createGain(); o.type=type;o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.02); }
const sfx={
  tick:()=>tone(1400,.025,'square',.025),
  land:()=>{tone(180,.18,'sine',.2,-100);tone(90,.2,'triangle',.15)},
  pick:()=>{tone(520,.07,'square',.05);tone(780,.09,'square',.05,0,.06)},
  sel:()=>tone(900,.04,'triangle',.05),
  buzz:()=>{tone(110,.6,'sawtooth',.08)},
  win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.18,'square',.05,0,i*.1))},
  lose:()=>{[392,330,262].forEach((f,i)=>tone(f,.22,'triangle',.07,0,i*.14))},
  coin:()=>{tone(1320,.06,'square',.04);tone(1760,.12,'square',.04,0,.05)},
};
const haptic=(ms=12)=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('en-US');
const cash=n=>{n=Math.round(n);const ng=n<0;n=Math.abs(n);return (ng?'-':'')+'$'+(n%100===0?(n/100).toLocaleString('en-US'):(n/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}))};
const initials=n=>n.replace(/\b(Jr\.?|Sr\.?|III|II|IV)\b/g,'').trim().split(/\s+/).map(w=>w[0]).filter(Boolean).slice(0,2).join('').toUpperCase();
const last=n=>{const p=n.replace(/\s+(Jr\.?|Sr\.?|III|II|IV)$/,'').split(' ');return p.length>1?p.slice(1).join(' '):n};
function teamColor(t){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 70% 45%)`}
const ICON={
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  re:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',
  hist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>',
  trophy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
  snd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>',
  mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>',
};

/* ---------- rooms ---------- */
const ROOMS={
  bts:[{id:'r',nm:'Rookie',fee:50},{id:'p',nm:'Pro',fee:250,lvl:2},{id:'l',nm:'Legend',fee:1000,lvl:4}],
  pvp:[{id:'r',nm:'Rookie',fee:100,skill:.3},{id:'p',nm:'Pro',fee:500,skill:.55,lvl:2},{id:'l',nm:'Legend',fee:2000,skill:.8,lvl:4}],
};
const RAKE=0.1;
const OPP_NAMES=['DunkTank_23','BaselineBoss','SplashLord','PaintBeast','NoLookNate','AnkleTaker','BuzzerBeatr','CourtVision9','GlassEater','StepBackSam','FadeAwayFi','PostMoveMo','AlleyOopAvi','ClutchCity','TripleDubT'];

/* ---------- state ---------- */
let S={screen:'home',tab:'home',rankSeg:'mine',storeSeg:'coins'};
let M=null; // current match
const TABS=[['ranks','History'],['home','Home'],['challenges','Missions'],['store','Store']];
const ARTIFACT_URL='https://claude.ai/artifact/DHdhQwcwffv282y6TDo2ki';
const NAVI={
  friends:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 5.5 5.3"/></svg>',
  ranks:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',
  challenges:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>',
  store:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',

/* ---------- daily, missions, streak, boosters ---------- */
const todayKey=()=>new Date().toISOString().slice(0,10);
P.boost=Object.assign({team:0,era:0,scout:0},P.boost||{});
P.streak=Object.assign({n:0,last:''},P.streak||{});
const STREAK=[200,300,400,500,700,900,1500];
const MISSIONS=[
  {id:'play3',t:'Play 3 matches',goal:3,rw:80},
  {id:'bts2',t:'Play 2 Beat the Score matches',goal:2,rw:120},
  {id:'pvpwin',t:'Win a Bot Duel',goal:1,rw:150},
  {id:'w55',t:'Post a 55-win season',goal:1,rw:150},
  {id:'w65',t:'Post a 65-win season',goal:1,rw:300},
  {id:'daily',t:'Finish the Daily Challenge',goal:1,rw:100},
  {id:'norespin',t:'Finish a draft with no respins',goal:1,rw:120},
  {id:'star',t:'Draft a 93+ rated legend',goal:1,rw:120},
  {id:'era',t:'Draft 3 players from one decade',goal:1,rw:150},
  {id:'cash',t:'Profit on the BTS ladder',goal:1,rw:100},
];
function missions(){const d=todayKey();if(!P.ms||P.ms.d!==d){const R=rng(hash32('ms'+d));const pool=MISSIONS.map(m=>m.id);const ids=[];while(ids.length<4)ids.push(pool.splice(Math.floor(R()*pool.length),1)[0]);P.ms={d,ids,prog:{},claimed:{}};save()}return P.ms}
function bump(id,n=1){const ms=missions();if(!ms.ids.includes(id))return null;const m=MISSIONS.find(x=>x.id===id);const b=ms.prog[id]||0;ms.prog[id]=Math.min(m.goal,b+n);return b<m.goal&&ms.prog[id]>=m.goal?m:null}
const claimable=()=>{const ms=missions();return ms.ids.filter(id=>!ms.claimed[id]&&(ms.prog[id]||0)>=MISSIONS.find(m=>m.id===id).goal).length};
function streakState(){const d=todayKey();const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  if(P.streak.last===d)return{can:false,day:P.streak.n};const cont=P.streak.last===y;return{can:true,day:cont?(P.streak.n%7)+1:1}}
function dailyState(){const d=todayKey();if(!P.daily||P.daily.d!==d)P.daily={d,started:false,done:false,w:0};return P.daily}
const dailySeed=()=>hash32('daily-'+todayKey());
function msToMidnight(){const n=new Date();const m=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+1);return m-n.getTime()}
function hms(ms){const s=Math.max(0,Math.floor(ms/1000));return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}

/* ---------- shared leaderboard (db capability) ---------- */
const DBX={db:null,user:null,uid:null,canWrite:null,rows:[],ready:false,writing:false,dirty:false};
(async()=>{
  try{
    let u=null,d=null;
    if(false)[u,d]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
    if(false){d=mockDb();let id;try{id=sessionStorage.getItem('bzuid')||('u'+Math.random().toString(36).slice(2,9));sessionStorage.setItem('bzuid',id)}catch(e){id='u1'}DBX.uid=id;DBX.canWrite=true}
    DBX.user=u;DBX.db=d;if(!d)return;
    if(u){try{DBX.uid=await u.id()}catch(e){}try{DBX.canWrite=await u.can('data.write')}catch(e){}}
    d.collection('scores').onSnapshot(s=>{DBX.rows=s.docs.map(x=>Object.assign({id:x.id},x.data()||{}));DBX.ready=true;if(S.screen==='home'&&S.tab==='ranks')render()},()=>{DBX.ready=true});
    pushScore();
  }catch(e){}
})();
function mockDb(){ /* local test double for ?mock=1 only */
  const bc=new BroadcastChannel('bzmockdb');const subs=[];const K='bzmockdb-scores';
  const all=()=>{try{return JSON.parse(localStorage.getItem(K)||'{}')}catch(e){return{}}};
  const emit=()=>{const a=all();const snap={docs:Object.entries(a).map(([id,v])=>({id,exists:true,data:()=>v}))};subs.forEach(f=>f(snap))};
  bc.onmessage=emit;
  return{collection:()=>({onSnapshot(f){subs.push(f);setTimeout(emit,0);return()=>{}},doc:id=>({set(v){const a=all();a[id]=v;try{localStorage.setItem(K,JSON.stringify(a))}catch(e){}emit();bc.postMessage(1);return Promise.resolve()}})})};
}
function pushScore(){
  if(!DBX.db||!DBX.uid||DBX.canWrite===false)return;
  if(DBX.writing){DBX.dirty=true;return}
  DBX.writing=true;
  const dl=dailyState();
  DBX.db.collection('scores').doc(DBX.uid).set({nick:P.name,lvl:level(),best:Math.max(P.best.bts||0,P.best.pvp||0,P.best.free||0),pvpW:P.pvpW,pvpL:P.pvpL,daily:dl.done?{d:dl.d,w:dl.w}:null,t:Date.now()})
    .catch(()=>{}).finally(()=>{DBX.writing=false;if(DBX.dirty){DBX.dirty=false;pushScore()}});
}
const num=(v,lo,hi)=>{v=+v;return isFinite(v)?Math.max(lo,Math.min(hi,Math.round(v))):0};

/* ---------- render ---------- */
function go(screen){S.screen=screen;render()}
function render(){
  const f={home:vTabs,mm:vMatchmaking,draft:vDraft,sim:vSim,result:vResult,wait:vWait}[S.screen];

    render.last=key;
  } else if(pane&&ps)pane.scrollTop=ps;
  const nav=$app.querySelector('.nav5');
  if(nav){const i=TABS.findIndex(t=>t[0]===S.tab);const pi=render.navI==null?i:render.navI;
    if(pi!==i){nav.style.setProperty('--i',pi);requestAnimationFrame(()=>requestAnimationFrame(()=>nav.style.setProperty('--i',i)))}render.navI=i}
  if(M&&M.justSpun){const l=$app.querySelector('.list');if(l)l.classList.add('enter');M.justSpun=false}
  render.tab=S.tab;render.lastScreen=S.screen;
  bind();syncCoins();
}

/* animated coin counter */
let SHOWN=P.coins;
function syncCoins(){
  const el=document.querySelector('#coins span:last-child');if(!el)return;
  if(SHOWN===P.coins){el.textContent=cash(P.coins);return}
  const from=SHOWN,to=P.coins,t0=performance.now(),d=Math.min(1200,300+Math.abs(to-from)/4);
  el.textContent=cash(from);SHOWN=to;
  const chip=document.getElementById('coins');chip.classList.remove('bump');void chip.offsetWidth;chip.classList.add(to>from?'bump':'drop');
  (function step(now){const k=Math.min(1,(now-t0)/d),e=1-Math.pow(1-k,3);const cur=document.querySelector('#coins span:last-child');if(cur)cur.textContent=cash(from+(to-from)*e);if(k<1)requestAnimationFrame(step)})(t0);
}
function flyCoins(fromEl,n=10){
  const chip=document.getElementById('coins');if(!chip)return;
  const a=(fromEl||chip).getBoundingClientRect(),b=chip.getBoundingClientRect();
  for(let i=0;i<n;i++){const c=document.createElement('span');c.className='coin flycoin';
    const x0=a.left+a.width/2+(Math.random()-.5)*60,y0=a.top+a.height/2+(Math.random()-.5)*30;
    c.style.cssText=`left:${x0}px;top:${y0}px;position:fixed;transition:transform .7s cubic-bezier(.5,-0.4,.6,1),opacity .7s;transition-delay:${i*45}ms`;
    document.body.appendChild(c);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.transform=`translate(${b.left+10-x0}px,${b.top+8-y0}px) scale(.6)`;c.style.opacity='.4'}));
    setTimeout(()=>{c.remove();if(i%3===0)sfx.coin()},760+i*45)}
}
function award(amount,fromEl){P.coins+=amount;save();flyCoins(fromEl,Math.min(14,4+Math.round(amount/100)));setTimeout(syncCoins,650)}

/* ---------- shell ---------- */

  const body={friends:vFriends,ranks:vRanks,home:vHome,challenges:vChallenges,store:vStore}[S.tab]();

function vHome(){
  const sk=streakState(),dl=dailyState();

    <button class="mode bts" data-act="mode" data-m="bts"><div class="tag">Solo · Cash ladder</div><h2>Beat the<br>Score</h2><p>Draft five, sim the 82-game season. Your record climbs the payout ladder, up to 50×.</p>

function vFriends(){
  const me=mePeer();
  const inc=incoming();
  const others=NET.peers.filter(p=>!p.sameTab&&p.kind==='viewer');
  const myCh=M&&0;
  const out=NET.myCh;

  const status=p=>{const pr=p.presence||{};return pr.m?['In a match','busy']:pr.q?['Searching '+(String(pr.q).split('-')[1]||'').toUpperCase(),'srch']:['Online','on']};

function hash32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const mePeer=()=>(NET.peers.find(p=>p.sameTab)||{}).peer;
function makeMock(){
  const myPeer=Math.random().toString(36).slice(2,12);
  function mk(name){
    const bc=new BroadcastChannel('bzmock-'+name);let mine={},others=new Map(),subs=new Set();
    const snap=()=>{const now=Date.now();for(const[k,v]of others)if(now-v.seen>5000)others.delete(k);
      return[{peer:myPeer,by:null,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:mine,updatedAt:now},...[...others.values()].map(v=>({peer:v.peer,by:null,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:v.presence,updatedAt:v.at}))]};
    const notify=()=>{const ps=snap();subs.forEach(f=>f({peers:ps,joined:[],left:[],updated:[]}))};
    const send=()=>bc.postMessage({t:'p',peer:myPeer,presence:mine});
    bc.onmessage=e=>{const m=e.data;if(m.peer===myPeer)return;
      if(m.t==='p'){const o=others.get(m.peer);const ch=!o||JSON.stringify(o.presence)!==JSON.stringify(m.presence);others.set(m.peer,{peer:m.peer,presence:m.presence,seen:Date.now(),at:ch?Date.now():o.at});if(!o)send();if(ch)notify()}
      if(m.t==='bye'){others.delete(m.peer);notify()}};
    const iv=setInterval(()=>{send();const n=others.size;snap();if(others.size!==n)notify()},1500);
    send();addEventListener('pagehide',()=>bc.postMessage({t:'bye',peer:myPeer}));
    return{name,presence(pt){const n={...mine};for(const k in pt){if(pt[k]===null)delete n[k];else n[k]=pt[k]}mine=n;send();notify();return Promise.resolve()},
      peers:snap,onPeers(f){subs.add(f);setTimeout(()=>f({peers:snap(),joined:snap(),left:[],updated:[]}),0);return()=>subs.delete(f)},
      connected:()=>true,onConnection(f){setTimeout(()=>f(true));return()=>{}},
      leave(){clearInterval(iv);bc.postMessage({t:'bye',peer:myPeer});bc.close();subs.clear();return Promise.resolve()},
      join:n=>Promise.resolve(mk(n))};
  }
  return mk('lobby');
}

    const raw=Array.isArray(pr.picks)?pr.picks.slice(0,5):[];
    const parsed=[],used=new Set();
    for(const pk of raw){if(!Array.isArray(pk))break;const[slot,pid]=pk;const pl=PIDX.get(pid);if(!pl||!POS.includes(slot)||used.has(slot)||!pl.pos.includes(slot))break;used.add(slot);parsed.push({slot,player:pl})}
    const before=M.oppShown;
    if(parsed.length>=before){M.oppPicks=parsed;M.oppShown=parsed.length}
    M.oppDone=M.oppDone||(!!pr.done&&parsed.length===5);
    if(parsed.length>before&&S.screen==='draft'){const lg=parsed[parsed.length-1];toast(`${M.opp.name} drafted ${lg.player.n} (${lg.slot})`,'opp')}
    oppRefresh();checkDone();
  } else if(!M.oppDone&&!M.ffTimer&&!M.finished){
    M.ffTimer=setTimeout(()=>{if(M&&M.live&&!M.oppDone){M.oppForfeit=true;checkDone();oppRefresh()}},25000);
    oppRefresh();
  }
}

/* reel animation */
function animReel(el,items,final,dur){
  return new Promise(res=>{
    const rs=el.querySelector('.rs');const H=el.clientHeight||64;
    const html=items.map(i=>`<div class="ri"><b>${i[0]}</b><small>${esc(i[1]||'')}</small></div>`).join('')+`<div class="ri"><b>${final[0]}</b><small>${esc(final[1]||'')}</small></div>`;
    rs.innerHTML=html;rs.style.transition='none';rs.style.transform='translateY(0)';void rs.offsetHeight;
    rs.style.transition=`transform ${dur}ms cubic-bezier(.12,.8,.22,1)`;rs.style.transform=`translateY(${-items.length*H}px)`;
    const box=el.parentElement;box.classList.remove('landed');box.classList.add('spinning');setTimeout(()=>box.classList.remove('spinning'),dur*.7);
    let n=0,iv=setInterval(()=>{sfx.tick();n++},70);
    setTimeout(()=>clearInterval(iv),dur*.55);
    setTimeout(()=>{clearInterval(iv);sfx.land();haptic(18);box.classList.add('landed');res()},dur);
  });
}
function randTeams(n){const t=DATA.teamList;return Array.from({length:n},()=>{const a=t[Math.floor(Math.random()*t.length)];return[a,DATA.teams[a].city]})}
function randEras(n){const e=BZ.ERA_ORDER;return Array.from({length:n},()=>[e[Math.floor(Math.random()*e.length)],'era'])}

async function doSpin(kind){
  const r=M.picks.length;
  let idx = kind==='spin'?M.seq[r].spin:kind==='team'?M.seq[r].team:M.seq[r].era;
  let pool=DATA.pools[idx];
  // dead pool guard: nobody fits open slots → deterministic reroll (same for both PvP players since it depends on seq + lineup)
  let guard=0;
  while(!eligible(pool,M.lineup).length && guard<40){const R2=rng(M.seed+r*131+guard*7+1);pool=DATA.pools[Math.floor(R2()*DATA.pools.length)];guard++}
  const prev=M.pool;
  M.phase='spinning';M.sel=null;M.newSlot=null;
  if(kind==='spin'){ M.pool=null; render(); }
  else { render(); }
  const T=document.getElementById('reelT'),E=document.getElementById('reelE');
  const jobs=[];
  const teamChanges = kind==='spin' || pool.t!==(prev&&prev.t);
  const eraChanges = kind==='spin' || pool.e!==(prev&&prev.e);
  if(teamChanges) jobs.push(animReel(T,randTeams(kind==='spin'?18:12),[pool.t,DATA.teams[pool.t].city],kind==='spin'?1300:1000));
  if(eraChanges) jobs.push(animReel(E,randEras(kind==='spin'?24:14),[pool.e,'era'],kind==='spin'?1800:1100));
  await Promise.all(jobs);
  if(guard)toast('No fits there. Free re-roll!');
  M.pool=pool;M.phase='pick';M.filter='ALL';M.justSpun=true;
  render();
}

function draft(slot){
  const p=M.pool.players.find(x=>x.id===M.sel);if(!p||M.lineup[slot])return;
  M.lineup[slot]=p;M.picks.push({slot,p,pool:M.pool.i});M.newSlot=slot;M.sel=null;M.pool=null;M.phase='spin';M.scout=false;
  setTimeout(()=>{const el=document.querySelector(`[data-slot="${slot}"] .jr`);if(el){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,26)}},60);
  sfx.pick();haptic(25);
  if(M.mode==='pvp'&&M.live){
    if(M.game)M.game.presence({picks:M.picks.map(x=>[x.slot,x.p.id]),done:M.picks.length===5}).catch(()=>{});
  } else if(M.mode==='pvp'){
    const target=Math.min(5,M.picks.length+(Math.random()<.3?1:0));
    const showOpp=()=>{ if(!M||M.mode!=='pvp')return; while(M.oppShown<target){const lg=M.oppDraft.log[M.oppShown];M.oppShown++; if(lg&&S.screen==='draft')toast(`${M.opp.name} drafted ${lg.player.n} (${lg.slot})`,'opp');} if(S.screen==='draft'){ if(M.phase==='spinning'){document.querySelectorAll('.opp .dots i').forEach((d,i)=>d.classList.toggle('on',i<M.oppShown))} else render(); } };
    setTimeout(showOpp,900+Math.random()*900);
  }
  if(M.picks.length===5){ render(); setTimeout(()=>{if(!M.live)M.oppShown=5;go('sim')},700); return; }
  render();
}
